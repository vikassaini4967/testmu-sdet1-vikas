name: Regression + AI triage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Any one of these enables AI triage; with none, the suite runs and triage is skipped.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Stay inside free-tier per-minute limits on a bad day.
      AI_MAX_CALLS_PER_RUN: 6

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Traceability (feature ⇄ json ⇄ spec ⇄ prompts.md)
        run: npm run check:trace

      - name: Target pre-flight
        run: npm run verify:target

      # "Learns over runs": restore the failure/outcome history from earlier runs.
      - name: Restore AI history
        uses: actions/cache/restore@v4
        with:
          path: .ai-history
          key: ai-history-${{ github.run_id }}
          restore-keys: ai-history-

      - name: Run suite
        run: npx playwright test

      - name: Save AI history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ai-history
          key: ai-history-${{ github.run_id }}

      - name: Post AI triage to the job summary
        if: always()
        run: cat ai-reports/ai-report.md >> "$GITHUB_STEP_SUMMARY" || echo "No AI report produced." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload AI triage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-report
          path: ai-reports/
          retention-days: 7
